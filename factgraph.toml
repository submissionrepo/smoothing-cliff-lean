verified = ["lean"]
location = "Smoothing_the_Cliff_ITCS.tex (prop:optcert clause (iv), divergence limit)"
notes = "Lean 4.30.0: SmoothingCliff.Racing.lt_isMaxOn_of_lt_double, agentRacingBurden_le_aggregates, racingBurden_le_aggregates, and maximizer_gt_of_racingBurden_small in Racing/OptimalCapDivergence.lean. The paper argues through the right derivative of the racing burden; the route here needs no derivative at all, only strict concavity and one comparison between a level and its double, which is why it composes directly with the already credentialed concavity. The burden bound isolates exactly the two aggregates the paper sends to zero. Full-file diagnostics: no findings; lean_verify scan_source=true: no warnings, axioms only propext/Classical.choice/Quot.sound. Ledger: smoothing_cliff_optcert_divergence_lean_20260813."

