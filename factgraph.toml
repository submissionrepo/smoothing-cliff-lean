[nodes.A_frontier_domain]
kind = "assumption"
statement = "Agents have eligible truthful bids weakly above a nonnegative reserve; one-slot weight and sensitivity are positive."

[nodes.A_frontier_rule]
kind = "assumption"
statement = "The reduced-form rule is anonymous, own-bid monotone, own-bid S-Lipschitz, nonnegative, and one-slot feasible on the eligible region."

[nodes.P_frontier2]
fingerprint = "sha256:5f4b272a0d29"
kind = "proposition"
statement = "For two eligible bidders and one slot, every anonymous monotone S-Lipschitz feasible interim rule is bounded by the capped-linear envelope, which is pointwise welfare-optimal; matched-certificate PL is strictly inside it at every positive bid gap."
depends_on = ["A_frontier_domain", "A_frontier_rule", "L_logistic_tangent"]
verified = ["lean"]
location = "Smoothing_the_Cliff_ITCS.tex:1483 (prop:frontier2)"
notes = "Lean 4.30.0: SmoothingCliff.Frontier.twoBidder_frontier. Full-file Lean-LSP diagnostics returned no findings; lean_verify source scan returned no warnings and only propext, Classical.choice, and Quot.sound. The formal theorem makes the paper's globally inherited nonnegative-reserve premise explicit because pointwise welfare optimality can fail under negative eligible values when feasible rules may discard mass. Ledger: smoothing_cliff_frontier2_lean_20260813."

