fingerprint = "sha256:89456970e9cc"
kind = "proposition"
statement = "Within positive continuous strictly increasing sequential Luce rules on eligible bids, invariance of the complete ranking distribution under every common nonnegative bid translation holds if and only if alpha(b)=c0*exp(b/tau) for some c0>0 and finite tau>0."
depends_on = ["A_luce_intensity"]
verified = ["lean"]
location = "Smoothing_the_Cliff_ITCS.tex:395 (prop:axiomatization), proof at 841-852"
notes = "Lean 4.30.0: SmoothingCliff.Mechanism.translation_invariant_rankings_iff_exponential. Eligible bids are represented exactly as reserve+x with x:NNReal. Valid ordered-tuple probabilities are products of sequential Luce stage probabilities; binary full rankings recover the pairwise odds, closing both directions between ranking-distribution invariance and the functional equation. The continuous Cauchy argument extends the additive log increment from NNReal to Real before applying linearity. Full-file Lean-LSP diagnostics and lean_verify source scans were clean; only standard axioms. Ledger: smoothing_cliff_axiomatization_lean_20260813."

