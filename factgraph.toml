kind = "lemma"
statement = "A strictly concave function whose value at twice a level exceeds its value at that level has its maximizer above the level; the racing burden is bounded by the top weight times the cap times the linear aggregate plus three halves of the squared cap times the quadratic aggregate; hence once both aggregates are small enough that the burden at twice a target falls below an eighth of the squared prize over the target, the optimal published cap exceeds the target."
