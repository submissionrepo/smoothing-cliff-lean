[nodes.T_impossibility]
fingerprint = "sha256:307ba64357ca"
kind = "theorem"
statement = "For n>=4 and nondegenerate weights, no rule in class C is pointwise welfare-optimal under the stated delta bound."
depends_on = ["P_squeeze", "L_ordering", "L_adjacent_shortfall"]
location = "Smoothing_the_Cliff_ITCS.tex:2296 (thm:impossibility)"
verified = ["lean"]
notes = "Lean 4.30.0: SmoothingCliff.Frontier.thm_impossibility in Frontier/RankRuleB.lean, on Frontier/NoPointwiseOptimum.lean. All five clauses are machine-checked with nothing assumed: the two caps, attainment of the R1 cap by rule A, the shortfall inequality 2a+(n-1)b >= 2 S delta^2 with its four hypotheses discharged from class membership, the second rule's tied-leader weight W/n+((n-1)/n) S delta together with the strict ceiling for any R1-cap attainer, and the conclusion that no certified rule is pointwise welfare-optimal. Rule A is affine in the band-clipped scores; rule B is built as an integral over levels of a density with coefficients kappa(1)=S/n and kappa(k)=2(n-1)S/(n(n-2)), which reduces every class property to two scalar monotonicity facts and the own-slope bound, the last binding exactly at n>=4. Feasibility is encoded as the permutohedron subset system, as in P_squeeze, so the credential is issued against that class. Two steps separate it from the paper's lottery formulation: Rado's theorem, absent from Mathlib though its equal-weight case is now proved in Frontier/SlotLottery.lean, and a measurable selection of the lottery across profiles, which the paper supplies by a lexicographic basic feasible decomposition. An audit on 2026-08-14 noted that the gap reaches the conclusion and not only the two attainment clauses, since a negative existential is not monotone in the class. RankRuleB.lean no_pointwise_optimum_in_subclass answers that by proving the conclusion for every class contained in the encoded one that contains the two exhibited rules, so the whole residue is the single fact that rule A and rule B are lottery-implementable. Full-file diagnostics clean; axioms only propext/Classical.choice/Quot.sound. Ledger: smoothing_cliff_impossibility_clauses_lean_20260814 and smoothing_cliff_impossibility_lean_20260814."

