kind = "lemma"
statement = "For the one-leader and two-leader adjacent profiles, the welfare shortfalls satisfy 2a+(n-1)b >= 2 S delta^2; attaining the first cap creates a strict allocation gap at the second profile."
depends_on = ["A_frontier_rule", "P_squeeze"]
verified = ["lean"]
