notes = "Lean 4.30.0: SmoothingCliff.Frontier.adjacent_profile_shortfall and tied_leader_strict_gap. These certify the complete algebraic contradiction once the cap equations and the two candidate rules are supplied. They do not certify the paper's global construction/measurable lottery implementation of rules A and B, so T_impossibility remains unverified."

